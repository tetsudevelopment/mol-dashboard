# MOLTECH Dashboard — reference compose file.
#
# NEXT_PUBLIC_* are BUILD-time values: change them and you must rebuild
# (`docker compose build --no-cache dashboard`), not just restart.
#
#   NEXT_PUBLIC_API_URL=https://backmolapi.vepay.com.co docker compose up -d --build

services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set NEXT_PUBLIC_API_URL before building}
        NEXT_PUBLIC_API_VERSION: ${NEXT_PUBLIC_API_VERSION:-v1}
    image: moltech-dashboard:${IMAGE_TAG:-latest}
    container_name: moltech-dashboard
    restart: unless-stopped
    ports:
      # host:container — the container always listens on 3011
      - "${HOST_PORT:-3011}:3011"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3011/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      # next/image writes optimized variants here at request time, so the
      # path must stay writable even with a read-only root filesystem.
      - type: tmpfs
        target: /app/.next/cache
        tmpfs:
          mode: 01777
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
